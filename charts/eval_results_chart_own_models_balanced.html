  html[data-theme="dark"] .panel-hint { color: #888; }
  html[data-theme="dark"] .bytes-legend-swatch { border-color: #555; }
  html[data-theme="dark"] #theme-toggle { background: #2a2a2a; border-color: #444; color: #e8e8e8; }

  /* Universal light mode styles (Triggered via data-theme="light") */

  * { box-sizing: border-box; }
  body { font-family: system-ui,-apple-system,sans-serif; padding: 1.5rem; max-width: 1020px; margin: 0 auto; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.2rem; }
  .subtitle { font-size: 0.82rem; margin: 0 0 1rem; }

  /* Add this class to your style block */
  .stripe-swatch {
    background: linear-gradient(45deg, #1c353d 25%, #447b8c 25%, #447b8c 50%, #1c353d 50%, #1c353d 75%, #447b8c 75%, #447b8c 100%) !important;
    background-size: 6px 6px !important;
  }

  /* Floating Theme Toggle button styling */
  #theme-toggle {
    position: fixed; top: 12px; right: 12px; z-index: 1000;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid; font-size: 16px; cursor: pointer; line-height: 1;
  }

  .controls-outer { margin-bottom: 0.8rem; display: flex; flex-direction: column; gap: 7px; }

  .toggle-btn .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .legends { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin-bottom: 2.5rem; }

  .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 2px; }

  .bar-half.hidden { flex: 0; width: 0; overflow: hidden; }
  .bar-seg { width: 100%; }
  .bar-half > *:last-child { border-radius: 3px 3px 0 0; }
  .bar-total { font-size: 10.5px; margin-top: 4px; text-align: center; opacity: 0.45; }
  .bar-label { font-size: 10.5px; margin-top: 5px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .x-label { font-size: 11px; text-align: center; margin-top: 0.6rem; opacity: 0.55; }

  .panel-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .panel-title { font-weight: 600; font-size: 13px; }
  .panel-total { font-size: 11.5px; opacity: 0.55; margin-left: 5px; }

  .col-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.5; margin-bottom: 6px; }

    body += `<line x1='0' y1='4' x2='8' y2='4' stroke='${fg}' stroke-width='1.2'/>`;
    body += `<line x1='4' y1='0' x2='4' y2='8' stroke='${fg}' stroke-width='1.2'/>`;
  }
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8'>${body}</svg>`;
  return `url("data:image/svg+xml,${svg}")`;
}

// Build patterns once; rebuild on color scheme change
let BYTES_PATTERNS = {};
function rebuildBytesPatterns() {
  BYTES_ORDER.forEach(b => { BYTES_PATTERNS[b] = makeBytesPattern(b); });
}
rebuildBytesPatterns();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  rebuildBytesPatterns();
  render();
});

function ccTier(l) {
  const p = l.CC_Pages;
  if (p == null || isNaN(p)) return 'no data';
  if (p < 1e6)   return '<1M';
  if (p < 1e7)   return '1M–10M';
  if (p < 1e8)   return '10M–100M';
  if (p < 1e9)   return '100M–1B';
  if (p < 1e10)  return '1B–10B';
  return '10B+';
}

let curScore='raw', curMode='entropy', curTIdx=1;
let showFam=true, showScr=false, showBytes=false, showCC=false;
let activeGroup=null, groupData=[];
let CHART_H = BASE_H, MAX_VAL = BASE_MAX;

function getCaseKey() { return `${curScore}_${curMode}`; }
function getColName() {
  const meta = MODES_META[getCaseKey()];
  return `${getCaseKey()}_t_${meta.thresholds[curTIdx].toFixed(4)}_pps_premium`;
}
function getPremium(lang) { const v=lang[getColName()]; return (v!=null&&!isNaN(v))?v:0; }
function groupFor(p) {
  if(p<1.0) return GROUPS[0];
  for(let i=0;i<GROUPS.length;i++) if(p>=BOUNDS[i]&&p<BOUNDS[i+1]) return GROUPS[i];
  return GROUPS[GROUPS.length-1];
}

function downloadCSV() {
  if (typeof LANG_DATA === 'undefined' || !LANG_DATA.length) {
    alert("Data is not available for download.");
    return;
  }

  // Define headers for the CSV file
  const headers = ["Language Name", "Language Family", "Writing System", "Bytes Per Char", "CC Pages", "Current Metric Column", "Patching Premium Score"];
  
  // Get active configurations for the filename and data tracking
  const currentMetricKey = getColName();
  const currentModeLabel = MODES_META[getCaseKey()].label;
  const currentThreshold = MODES_META[getCaseKey()].thresholds[curTIdx].toFixed(4);
  
  // Map rows from LANG_DATA
  const rows = LANG_DATA.map(lang => {
    const name = `"${lang.Name.replace(/"/g, '""')}"`;
    const family = `"${(lang.Family || '').replace(/"/g, '""')}"`;
    const script = `"${(lang.Script_Type || '').replace(/"/g, '""')}"`;
    const bytes = `"${lang.Bytes_Per_Char || '1 byte'}"`;
    const ccPages = lang.CC_Pages != null ? lang.CC_Pages : "no data";
    const premium = getPremium(lang).toFixed(4);

    return [name, family, script, bytes, ccPages, currentMetricKey, premium];
  });

  // Combine headers and rows into a unified string
  const csvContent = [headers.join(","), ...rows.map(e => e.join(","))].join("\n");

  // Create a blob and trigger browser download download
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  
  if (link.download !== undefined) { 
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    
    // Friendly contextual filename matching current parameters
    const filename = `blt_fairness_${currentModeLabel.toLowerCase()}_t${currentThreshold}.csv`;
    link.setAttribute("download", filename);
    
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
}

function setMode(m) {
  curMode = m;
  if (m !== 'entropy') curScore = 'raw';  // norm only available for entropy
  curTIdx = MODES_META[getCaseKey()].anchor_idx;
  ['entropy', 'monotonicity'].forEach(x =>
    document.getElementById(`btn-mode-${x}`).classList.toggle('active', x === m));
  renderThresholdBtns();
  render();
}

function renderThresholdBtns() {
  const meta = MODES_META[getCaseKey()];
  const c = document.getElementById('threshold-btns');
  c.innerHTML = '';

  const stops = meta.thresholds;
  const anchorIdx = meta.anchor_idx;
  const minV = stops[0], maxV = stops[stops.length - 1];
  const thumbR = 8;
  const toPos = v => `calc(${((v - minV) / (maxV - minV)).toFixed(5)} * (100% - ${2 * thumbR}px) + ${thumbR}px)`;

  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'display:flex;flex-direction:column;gap:2px;width:100%';

  // ── Slider operates on actual values ────────────────────────────────────────
  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = minV;
  slider.max = maxV;
  slider.step = 'any';
  slider.value = stops[curTIdx];
  slider.style.cssText = 'width:100%;cursor:pointer;margin:0';

  slider.oninput = () => {
    // Snap to nearest stop
    const v = +slider.value;
    const nearest = stops.reduce((best, t, i) =>
      Math.abs(t - v) < Math.abs(stops[best] - v) ? i : best, 0);
    curTIdx = nearest;
    slider.value = stops[nearest]; // snap thumb
    updateLabels();
    render();
  };

  // ── Proportional tick labels ─────────────────────────────────────────────
  const tickRow = document.createElement('div');
  tickRow.style.cssText = 'position:relative;height:16px;width:100%';

  const labelEls = stops.map((t, i) => {
    const el = document.createElement('div');
    el.style.cssText = `position:absolute;transform:translateX(-50%);left:${toPos(t)};
      font-size:9.5px;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer`;
    el.textContent = t.toFixed(4) + (i === anchorIdx ? ' ★' : '');
    el.onclick = () => { curTIdx = i; slider.value = stops[i]; updateLabels(); render(); };
    tickRow.appendChild(el);
    return el;
  });

  function updateLabels() {
    labelEls.forEach((el, i) => {
      el.style.opacity = i === curTIdx ? '0.9' : '0.35';
      el.style.fontWeight = i === curTIdx ? '600' : '';
    });
  }
  updateLabels();

  const sliderCol = document.createElement('div');
  sliderCol.style.cssText = 'display:flex;flex-direction:column;gap:2px;min-width:260px;max-width:420px';
  sliderCol.appendChild(slider);
  sliderCol.appendChild(tickRow);

  const sliderRow = document.createElement('div');
  sliderRow.style.cssText = 'display:flex;align-items:center;gap:20px';
  sliderRow.appendChild(sliderCol);

  wrapper.appendChild(sliderRow);
  c.appendChild(wrapper);
}

function toggleBar(which) {
  if(which==='fam')   showFam   =!showFam;
  if(which==='scr')   showScr   =!showScr;
  if(which==='bytes') showBytes =!showBytes;
  if(which==='cc')    showCC    =!showCC;
  document.getElementById('btn-fam').classList.toggle('active',showFam);
  document.getElementById('btn-scr').classList.toggle('active',showScr);
  document.getElementById('btn-bytes').classList.toggle('active',showBytes);
  document.getElementById('btn-cc').classList.toggle('active',showCC);
  GROUPS.forEach((_,gi)=>{
    document.getElementById(`fam-half-${gi}`)?.classList.toggle('hidden',!showFam);
    document.getElementById(`scr-half-${gi}`)?.classList.toggle('hidden',!showScr);
    document.getElementById(`bytes-half-${gi}`)?.classList.toggle('hidden',!showBytes);
    document.getElementById(`cc-half-${gi}`)?.classList.toggle('hidden',!showCC);
  });
  renderLegends();
  if(activeGroup!==null) renderPanel(activeGroup,null,null);
}

// ── px() uses current MAX_VAL and CHART_H ────────────────────────────────────
function px(v) { return Math.round((v/MAX_VAL)*CHART_H); }
function distributeHeights(counts,total) {
  const target=px(total);
  if(target<=0) return counts.map(()=>0);
  const raw=counts.map(n=>(n/total)*target);
  const floors=raw.map(Math.floor);
  let rem=target-floors.reduce((a,b)=>a+b,0);
  const idx=raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  for(let i=0;i<rem;i++) floors[idx[i]]++;
  return floors;
}

function computeGroupData() {
  return GROUPS.map(g=>{
    const langs=LANG_DATA.filter(l=>groupFor(getPremium(l))===g);
    const fam={},scr={},bytes={},cc={};
    langs.forEach(l=>{
      fam[l.Family]=(fam[l.Family]||0)+1;
      scr[l.Script_Type]=(scr[l.Script_Type]||0)+1;
      const b=l.Bytes_Per_Char||'1 byte'; bytes[b]=(bytes[b]||0)+1;
      const c=ccTier(l); cc[c]=(cc[c]||0)+1;
    });
    return {total:langs.length,langs,fam,scr,bytes,cc};
  });
}

function renderYAxis() {
  const yAxis=document.getElementById('y-axis');
  yAxis.style.height=CHART_H+'px';
  yAxis.style.position='relative';
  yAxis.innerHTML='';
  // nice tick values
  const step = 2; // Hardcoded step size
  const ticks=[0];
  for(let v=step; v<=MAX_VAL; v+=step) ticks.push(v);
  ticks.forEach(v=>{
    const t=document.createElement('div');
    t.className='axis-tick'; t.textContent=v;
    t.style.position='absolute'; t.style.right='0';
    // align bottom of tick text with the grid line
    t.style.bottom=(px(v)-6)+'px';
    yAxis.appendChild(t);
  });
}

function renderBars() {
  groupData=computeGroupData();
  const totals=groupData.map(g=>g.total);
  const dataMax=Math.max(...totals,1);
  // expand if data exceeds base, keep exact multiple for clean axis
  MAX_VAL = dataMax <= BASE_MAX ? BASE_MAX : dataMax;
  // scale chart height proportionally so bar widths stay the same
  CHART_H = Math.round((MAX_VAL / BASE_MAX) * BASE_H);

  renderYAxis();

  const barsRow=document.getElementById('bars-row');
  barsRow.style.height=CHART_H+'px';
  barsRow.innerHTML='';

  groupData.forEach((gd,gi)=>{
    const col=document.createElement('div');
    col.className='group-col';

    const pair=document.createElement('div');
    pair.className='bar-pair'+(activeGroup===gi?' selected':'');
    pair.id=`pair-${gi}`;

    function makeHalf(id, entries, bgFn, useDistribute) {
      const half=document.createElement('div');
      const hidden=(id==='fam'&&!showFam)||(id==='scr'&&!showScr)||(id==='bytes'&&!showBytes)||(id==='cc'&&!showCC);
      half.className='bar-half'+(hidden?' hidden':'');
      half.id=`${id}-half-${gi}`;
      const valid=entries.filter(([,n])=>n>0);
      if(valid.length>0 && gd.total>0){
        const heights=useDistribute
          ? distributeHeights(valid.map(([,n])=>n), gd.total)
          : valid.map(([,n])=>px(n));
        valid.forEach(([key],i)=>{
          const seg=document.createElement('div');
          seg.className='bar-seg';
          seg.style.height=heights[i]+'px';
          seg.style.background=bgFn(key);
          half.appendChild(seg);
        });
      }
      return half;
    }

    pair.appendChild(makeHalf('fam',
      Object.keys(FAM_COLORS).map(f=>[f,gd.fam[f]||0]),
      k=>FAM_COLORS[k]||'#888', true));
    pair.appendChild(makeHalf('scr',
      ['Logographic','Logosyllabary','Syllabary','Abugida','Abjad','Alphabet'].map(s=>[s,gd.scr[s]||0]),
      k=>SCRTYPE_COLORS[k]||'#888', false));
    pair.appendChild(makeHalf('bytes',
      BYTES_ORDER.map(b=>[b,gd.bytes[b]||0]),
      k=>BYTES_PATTERNS[k]||'#888', true));
    pair.appendChild(makeHalf('cc',
      [...CC_TIERS].reverse().map(t=>[t,gd.cc[t]||0]),
      k=>CC_COLORS[k]||'#888', false));

    pair.onclick=()=>{
      document.querySelectorAll('.bar-pair').forEach(p=>p.classList.remove('selected'));
      if(activeGroup===gi){activeGroup=null;closePanel();return;}
      activeGroup=gi; pair.classList.add('selected');
      renderPanel(gi,null,null);
    };

    const total=document.createElement('div');
    total.className='bar-total'; total.textContent=gd.total||'';
    const label=document.createElement('div');
    label.className='bar-label'; label.textContent=GROUPS[gi];

    col.appendChild(pair); col.appendChild(total); col.appendChild(label);
    barsRow.appendChild(col);
  });
}

// ── Bytes swatch for legend/panel ────────────────────────────────────────────
function bytesSwatch(b) {
  // Use a small canvas-free inline SVG img element for legend
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const bg = dark ? '#2a2a2a' : '#f0f0f0';
  const fg = dark ? '#909090' : '#666666';
  let lines = `<rect width="8" height="8" fill="${bg}"/>`;
  if(b==='1 byte') lines+=`<line x1="0" y1="4" x2="8" y2="4" stroke="${fg}" stroke-width="1.5"/>`;
  else if(b==='2 bytes') lines+=`<circle cx="4" cy="4" r="1.8" fill="${fg}"/>`;
  else { lines+=`<line x1="0" y1="4" x2="8" y2="4" stroke="${fg}" stroke-width="1.2"/><line x1="4" y1="0" x2="4" y2="8" stroke="${fg}" stroke-width="1.2"/>`; }
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14">${lines}</svg>`;
  const encoded = encodeURIComponent(svgStr);
  return `<img src="data:image/svg+xml,${encoded}" width="14" height="14" style="border-radius:2px;vertical-align:middle;flex-shrink:0" class="bytes-legend-swatch">`;
}

function renderLegends() {
  const container=document.getElementById('legends-container');
  container.innerHTML='';
  function addGroup(title,html){
    const grp=document.createElement('div');
    grp.className='legend-group';
    grp.innerHTML=`<div class="section-label">${title}</div><div class="legend-row">${html}</div>`;
    container.appendChild(grp);
  }
  if(showFam){
    const items=Object.entries(FAM_COLORS).filter(([f])=>LANG_DATA.some(l=>l.Family===f))
      .map(([f,c])=>`<span class="legend-item"><span class="legend-swatch" style="background:${c}"></span>${f}</span>`).join('');
    addGroup('Language family',items);
  }
  if(showScr){
    const items=Object.entries(SCRTYPE_COLORS)
      .map(([t,c])=>`<span class="legend-item"><span class="legend-swatch" style="background:${c}"></span>${t}</span>`).join('');
    addGroup('Writing system type',items);
  }
  if(showBytes){
    const items=BYTES_ORDER.map(b=>`<span class="legend-item" style="display:flex;align-items:center;gap:4px">${bytesSwatch(b)}<span>${b}</span></span>`).join('');
    addGroup('Bytes per character',items);
  }
  if(showCC){
    const items=CC_TIERS.map(t=>{
      const brd=(t==='1B–10B'||t==='10B+'||t==='no data')?';border:1px solid #555':'';
      return `<span class="legend-item"><span class="legend-swatch" style="background:${CC_COLORS[t]}${brd}"></span>${t}</span>`;
    }).join('');
    addGroup('CC training data (pages)',items);
  }
}

function renderPanel(gi,filterType,filterVal) {
  const gd=groupData[gi];
  const panel=document.getElementById('panel');
  if(filterType){
    let langs,swatch,color='#888';
    if(filterType==='fam'){
      langs=gd.langs.filter(l=>l.Family===filterVal);
      color=FAM_COLORS[filterVal]||'#888';
      swatch=`<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${color};vertical-align:middle;"></span>`;
    } else if(filterType==='scr'){
      langs=gd.langs.filter(l=>l.Script_Type===filterVal);
      color=SCRTYPE_COLORS[filterVal]||'#888';
      swatch=`<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${color};vertical-align:middle;"></span>`;
    } else if(filterType==='bytes'){
      langs=gd.langs.filter(l=>(l.Bytes_Per_Char||'1 byte')===filterVal);
      swatch=bytesSwatch(filterVal);
    } else {
      langs=gd.langs.filter(l=>ccTier(l)===filterVal);
      const brd=(filterVal==='1B–10B'||filterVal==='10B+'||filterVal==='no data')?';border:1px solid #555':'';
      color=CC_COLORS[filterVal]||'#888';
      swatch=`<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${color}${brd};vertical-align:middle;"></span>`;
    }
    langs.sort((a,b)=>getPremium(a)-getPremium(b));
    panel.innerHTML=`
      <div class="lang-list-header">
        <button class="lang-list-back" onclick="renderPanel(${gi},null,null)">← back</button>
        <span class="lang-list-title">${swatch} ${filterVal} · group ${GROUPS[gi]}</span>
        <span style="font-size:11px;opacity:0.45">${langs.length} language${langs.length!==1?'s':''}</span>
      </div>
      <div class="lang-tags">${langs.map(l=>`<span class="lang-tag" style="background:${color}22;border:1px solid ${color}44">
        ${l.Name} <span class="lang-prem">${getPremium(l).toFixed(2)}×</span></span>`).join('')}</div>`;
    return;
  }

  function makeRows(entries,colorFn,swatchFn,type){
    return entries.map(([key,count])=>{
      const sw=swatchFn?swatchFn(key):`<span class="fam-swatch" style="background:${colorFn(key)}"></span>`;
      const safe=key.replace(/'/g,"\\'");
      return `<div class="fam-row" onclick="renderPanel(${gi},'${type}','${safe}')">
        ${sw}<span class="fam-name">${key}</span><span class="fam-count">${count}</span><span class="fam-arrow">›</span></div>`;
    }).join('');
  }

  let cols='';
  if(showFam){
    const e=Object.entries(gd.fam).sort((a,b)=>b[1]-a[1]);
    cols+=`<div class="panel-col"><div class="col-title">Language family</div>${makeRows(e,k=>FAM_COLORS[k]||'#888',null,'fam')}</div>`;
  }
  if(showScr){
    const e=Object.entries(gd.scr).sort((a,b)=>b[1]-a[1]);
    cols+=`<div class="panel-col"><div class="col-title">Writing system</div>${makeRows(e,k=>SCRTYPE_COLORS[k]||'#888',null,'scr')}</div>`;
  }
  if(showBytes){
    const e=BYTES_ORDER.map(b=>[b,gd.bytes[b]||0]).filter(([,n])=>n>0);
    cols+=`<div class="panel-col"><div class="col-title">Bytes / char</div>${makeRows(e,null,k=>bytesSwatch(k),'bytes')}</div>`;
  }
  if(showCC){
    const e=CC_TIERS.map(t=>[t,gd.cc[t]||0]).filter(([,n])=>n>0).reverse();
    const brd=k=>(k==='1B–10B'||k==='10B+'||k==='no data')?';border:1px solid #555':'';
    cols+=`<div class="panel-col"><div class="col-title">CC training data</div>${
      e.map(([key,count])=>`<div class="fam-row" onclick="renderPanel(${gi},'cc','${key.replace(/'/g,"\\'")}')">
        <span class="fam-swatch" style="background:${CC_COLORS[key]}${brd(key)}"></span>
        <span class="fam-name">${key}</span><span class="fam-count">${count}</span><span class="fam-arrow">›</span></div>`).join('')
    }</div>`;
  }

  panel.innerHTML=`
    <div class="panel-header">
      <div><span class="panel-title">Group ${GROUPS[gi]}</span><span class="panel-total">${gd.total} language${gd.total!==1?'s':''}</span></div>
      <button class="close-btn" onclick="closePanel()">×</button>
    </div>
    <div class="panel-cols">${cols}</div>`;
}

function closePanel(){
  activeGroup=null;
  document.querySelectorAll('.bar-pair').forEach(p=>p.classList.remove('selected'));
  document.getElementById('panel').innerHTML='<span class="panel-hint">Click a bar group to explore families and writing systems.</span>';
}

// Paste this initialization snippet right at the start of your <script> logic
const themeBtn = document.getElementById('theme-toggle');
const htmlEl = document.documentElement;
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

htmlEl.dataset.theme = prefersDark ? 'dark' : 'light';
themeBtn.textContent = prefersDark ? '☀️' : '🌙';

themeBtn.addEventListener('click', () => {
  const isCurrentlyDark = htmlEl.dataset.theme === 'dark';
  htmlEl.dataset.theme = isCurrentlyDark ? 'light' : 'dark';
  themeBtn.textContent = isCurrentlyDark ? '🌙' : '☀️';
  
  // Optional: If your code uses a variable like `langColor` inside a dynamic render loop, 
  // you can call your chart update function here (e.g., render() or updateChart())
});

function render(){ closePanel(); renderBars(); }

renderThresholdBtns(); renderLegends(); render();
</script>
