# Adapted from bytelatent/configs/entropy_model.yaml for:
#   - single-node, 8x RTX 2080 Ti (Turing, 11GB, PCIe-only, no NVLink)
#   - 20-language fairness-weighted mix (see langs_chosen.csv)
#   - Medium model size (dim=512, n_heads=8, n_layers=12, ~41.0M params)
#
# Changes vs. the original repo config, and why:
#
#   distributed.fsdp_type: full_shard -> no_shard
#     Medium (~41M params) comfortably fits in 11GB/GPU without parameter
#     sharding. full_shard adds all-gather/reduce-scatter traffic per step
#     that's pure overhead here, especially over PCIe with no NVLink.
#
#   distributed.model_dtype: bf16 -> fp16
#     Turing (compute capability 7.5) has NO bf16 tensor-core support --
#     bf16 falls back to an unaccelerated path. fp16 DOES have Turing
#     tensor-core acceleration, which is what you actually want here.
#     Caveat: this codebase has no GradScaler, so fp16 has no automatic
#     loss-scaling safety net. Watch grad_norm in the logs for NaN/Inf in
#     the first few hundred steps; if you see it, switch model_dtype to
#     fp32 (slower, but numerically safe) as a fallback.
#
#   distributed.matmul_allow_tf32: unchanged (false)
#     TF32 is Ampere+ only; this setting is a no-op on Turing either way.
#
#   entropy_model.*: Repo-scale (dim=768/12h/14L) -> Medium (dim=512/8h/12L)
#     See earlier sizing discussion: Medium is the config where every
#     language's fairness-adjusted byte requirement is comfortably covered,
#     multi-epoch training fits easily in a 48h budget, and per-language
#     BPB should be checked against Repo-scale before committing further.
#
#   data.*: single dclm_baseline_1.0 source -> 20 language sources
#     One entry per language in `sources`, weight 1.0 each. Because each
#     language's shard already holds its fairness-adjusted (equal-content)
#     byte allocation (see add_language_allocations.py), equal sampling
#     weights preserve that fairness: smaller-byte-footprint languages
#     (e.g. cmn_Hans) simply loop back to the start of their shard sooner
#     than byte-heavy ones (e.g. tam_Taml), which is the intended behavior.
#
#   data.file_format: arrow -> json
#     Reads *.chunk.*.jsonl directly (see prepare_language_shards.py output),
#     skipping the arrow-shard preprocessing step entirely -- that step is
#     for the main BLT patcher model's precomputed entropies, not needed
#     when training the entropy model itself (add_patches: false already
#     signals this in the original config too).
#
#   data.batch_size: 2 -> 24 (starting point, TUNE THIS)
#     The original 2 was sized for the full 768-dim/14-layer model on
#     whatever cluster GPUs Meta used. Medium is much smaller and your
#     2080 Tis have 11GB each with room to spare. Start at 24, watch
#     nvidia-smi during the first ~50 steps, and increase/decrease from
#     there -- there's no way to know the right number without testing on
#     your actual hardware.
#
#   steps: sized for ~a few epochs over the full 20-language mix at this
#     batch size; adjust once you've measured real wall-clock throughput
#     (see the note at the bottom of this file).

dump_dir: /local/scratch/dfische/blt/dumps/entropy_medium_20lang
name: "entropy_medium_20lang"
steps: 40_000
max_steps: null
probe_freq: null
seed: 777

optim:
  lr: 4e-04
  warmup: 500
  lr_min_ratio: 0.1
  clip: 10.0

distributed:
  fsdp_type: no_shard
  model_dtype: fp16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

train_entropy_model: true
model: null
entropy_model:
  dim: 512
  n_layers: 12
  n_heads: 8
  max_seqlen: 8192
  vocab_size: 260
  ffn_dim_multiplier: 1.0
  sliding_window: 512
  attn_bias_type: "local_block_causal"
  attn_impl: "xformers"

data:
  root_dir: /local/scratch/dfische/blt/data/lang_shards
  sources:
    eng_Latn: 1.0
    deu_Latn: 1.0
    spa_Latn: 1.0
    ita_Latn: 1.0
    fra_Latn: 1.0
    ron_Latn: 1.0
    hrv_Latn: 1.0
    srp_Cyrl: 1.0
    nya_Latn: 1.0
    fin_Latn: 1.0
    vie_Latn: 1.0
    kat_Geor: 1.0
    arb_Arab: 1.0
    heb_Hebr: 1.0
    tam_Taml: 1.0
    tha_Thai: 1.0
    amh_Ethi: 1.0
    kor_Hang: 1.0
    jpn_Jpan: 1.0
    cmn_Hans: 1.0
  batch_size: 24
  prefetch_size: 64
  seq_len: 8192
  max_encoder_seq_length: 8192
  load_async: true
  file_format: "json"
  preprocess_dir: null
  add_patches: false
  patcher_args:
    patching_mode: byte
  tokenizer_args:
    name: blt

profiling:
  run: false

checkpoint:
  dump:
    every: 500
    keep: 3
  eval:
    every: 1000
    keep: -1

logging:
  freq: 10

eval_on_gpus: null
eval: null
async_eval_gpus: null

# --------------------------------------------------------------------------
# Launch (single node, 8 GPUs, no SLURM -- stool.py/launch_job are for
# Meta's SLURM cluster and aren't relevant here):
#
#   torchrun --nproc_per_node=8 --standalone \
#       -m bytelatent.train config=entropy_model_2080ti.yaml
#
# Before the real run, do a short smoke test to calibrate batch_size and
# get a real wall-clock steps/sec number instead of relying on the
# earlier TFLOPS-based estimate:
#
#   torchrun --nproc_per_node=8 --standalone \
#       -m bytelatent.train config=entropy_model_2080ti.yaml \
#       steps=50 checkpoint.dump.every=1000000 checkpoint.eval.every=1000000
#
# Watch nvidia-smi memory usage and the "grad" (grad_norm) column in the
# logs during this smoke test -- OOM means lower batch_size, NaN/Inf grad
# norm means switch distributed.model_dtype to fp32.
# --------------------------------------------------------------------------