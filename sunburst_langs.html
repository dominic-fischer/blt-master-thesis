function lighten(hex, f) {
  const r = parseInt(hex.slice(1,3),16),
        g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r+(255-r)*f)},${Math.round(g+(255-g)*f)},${Math.round(b+(255-b)*f)})`;
}

const famNames = [...new Set(ALL.filter(x => x.d === 1 && !x.is_stub).map(x => x.n))].sort();
const byId = {};
ALL.forEach(x => { byId[x.id] = x; });
const ch = {};
ALL.forEach(x => { if (x.p) { if (!ch[x.p]) ch[x.p] = []; ch[x.p].push(x.id); } });

// Threshold: node expands children if its count STRICTLY exceeds ceil(pct/100 * TOTAL)
function buildVisible(pct) {
  const thresh = Math.ceil(pct / 100 * TOTAL);
  const inc = new Set(ALL.filter(x => x.d === 1).map(x => x.id));
  let changed = true;
  while (changed) {
    changed = false;
    for (const id of [...inc]) {
      const node = byId[id];
      if (node && !node.is_stub && node.v > thresh && node.v > 1) {
        (ch[id] || []).forEach(cid => {
          if (!inc.has(cid)) { inc.add(cid); changed = true; }
        });
      }
    }
  }
  return ALL.filter(x => inc.has(x.id));
}

function render(pct) {
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '';
  const nodes = buildVisible(pct);
  const incIds = new Set(nodes.map(x => x.id));

  const W = wrap.clientWidth || 700;
  const availH = window.innerHeight - wrap.getBoundingClientRect().top - 24;
  const H = Math.min(W, Math.max(availH, 500));
  const cx = W / 2, cy = H / 2;
  const outerR = Math.min(cx, cy) - 88;  // leave room for leader-line labels
  const holeR = outerR * 0.11;
  const maxD = d3.max(nodes.filter(x => !x.is_stub), x => x.d) || 1;
  const bandW = (outerR - holeR) / maxD;

  function rInner(d) { return outerR - d * bandW + 1; }
  function rOuter(d) { return outerR - (d - 1) * bandW - 1; }

  const svg = d3.select(wrap).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${cx},${cy})`);

  const sdata = [
    { sid: 'ROOT', spid: null, orig: null },
    ...nodes.map(n => ({ sid: n.id, spid: n.p || 'ROOT', orig: n }))
  ];

  let hier;
  try { hier = d3.stratify().id(x => x.sid).parentId(x => x.spid)(sdata); }
  catch (e) { console.error(e); return; }

  const GEO_ORDER = [
    "Atlantic-Congo","Mande","Nilotic","Saharan","Afro-Asiatic",
    "Indo-European","Uralic","Kartvelian","Nakh-Daghestanian",
    "Turkic","Mongolic-Khitan","Sino-Tibetan","Koreanic","Japonic","Dravidian",
    "Tai-Kadai","Austroasiatic","Austronesian",
    "Aymaran","Quechuan","Tupian","Isolate","Artificial Language"
  ];

  const root = hier.sum(x => {
    if (!x.orig) return 0;
    const o = x.orig;
    const hasRealKids = (ch[o.id] || []).filter(c => incIds.has(c) && !byId[c]?.is_stub).length > 0;
    return hasRealKids ? 0 : o.v;
  });

  // Sort top-level families by geographic order; within families sort by value descending
  root.sort((a, b) => {
    const aFam = a.data.orig ? a.data.orig.id.split('>')[0] : '';
    const bFam = b.data.orig ? b.data.orig.id.split('>')[0] : '';
    const aTop = a.depth === 1 && a.data.orig && a.data.orig.d === 1;
    const bTop = b.depth === 1 && b.data.orig && b.data.orig.d === 1;
    if (aTop && bTop) {
      const ai = GEO_ORDER.indexOf(aFam);
      const bi = GEO_ORDER.indexOf(bFam);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    }
    if (aFam === bFam) return b.value - a.value;
    return 0;
  });

  d3.partition().size([2 * Math.PI, 1])(root);

  const arc = d3.arc()
    .startAngle(x => x.x0).endAngle(x => x.x1)
    .padAngle(0.008).padRadius(outerR * 0.5)
    .innerRadius(x => { if (!x.data.orig) return 0; return rInner(x.data.orig.d); })
    .outerRadius(x => { if (!x.data.orig) return 0; return rOuter(x.data.orig.d); })
    .cornerRadius(2);

  const tt = document.getElementById('tt');

  const pulledLabels = [];

  // Build a map: family name → bottomHalf, derived from the family's own mid-angle.
  // All children inherit their root family's direction.
  const famBottomHalf = {};
  root.descendants().filter(x => x.data.orig && x.data.orig.d === 1 && !x.data.orig.is_stub).forEach(x => {
    const famAng = (x.x0 + x.x1) / 2;
    famBottomHalf[x.data.orig.n] = famAng >= Math.PI / 2 && famAng <= 3 * Math.PI / 2;
  });

  root.descendants().filter(x => x.data.orig && !x.data.orig.is_stub).forEach(x => {
    const o = x.data.orig;
    const fam = o.id.split('>')[0];
    const base = FAM_COLORS[fam] || '#888';
    const fill = lighten(base, (o.d - 1) * 0.09);
    const rgb = fill.match(/\d+/g) || ['128','128','128'];
    const brightness = (+rgb[0]*299 + (+rgb[1]||0)*587 + (+rgb[2]||0)*114) / 1000;
    const tc = brightness > 145 ? '#111' : '#eee';

    const langs = o.langs || [];
    const tlangsSet = new Set(o.tlangs || []);

    g.append('path').attr('d', arc(x))
      .attr('fill', fill)
      .attr('stroke', 'rgba(255,255,255,0.35)').attr('stroke-width', 0.5)
      .style('cursor', 'pointer')
      .on('mousemove', ev => {
        const pct2 = (o.v / TOTAL * 100).toFixed(1);
        const path = o.id.replace(/>/g, ' › ');

        // Build language list: bold if terminal here, normal otherwise
        const langHTML = langs.map(l =>
          tlangsSet.has(l)
            ? `<b style="color:#aaa;">${l}</b>`
            : `<span style="color:#a8a7a7;">${l}</span>`
        ).join(', ');

        let html = `<div style="font-weight:600;font-size:13px;margin-bottom:2px;">${o.n}</div>`;
        html += `<div style="font-size:10px;color:#888;margin-bottom:4px;">${path}</div>`;
        html += `<div style="font-size:12px;font-weight:500;margin-bottom:${langs.length ? '5px' : '0'};">${o.v} language${o.v !== 1 ? 's' : ''} · ${pct2}%</div>`;
        if (langs.length) {
          html += `<div style="font-size:10px;color:#555;border-top:1px solid #eee;padding-top:4px;">${langHTML}</div>`;
        }
        tt.innerHTML = html;
        tt.style.opacity = '1';
        tt.style.left = (ev.clientX + 16) + 'px';
        tt.style.top  = (ev.clientY - 10) + 'px';
      })
      .on('mouseleave', () => { tt.style.opacity = '0'; });

    // Labels — curved text-on-path for all rings
    const ri2 = rInner(o.d), ro2 = rOuter(o.d);
    const midR = (ri2 + ro2) / 2;
    const spanAngle = x.x1 - x.x0;          // angular width of wedge
    const arcLen    = spanAngle * midR;       // arc length at mid-radius
    const radH      = ro2 - ri2;             // band height
    const lbl       = o.n;
    const ang       = (x.x0 + x.x1) / 2;    // mid-angle

    // Font size capped by available space (same rule as before)
    const fs = Math.max(7, Math.min(o.d === 1 ? 10 : 11,
                arcLen / lbl.length * 1.3, radH * 0.52));

    // Does the text fit inside the wedge?
    const fits = arcLen > lbl.length * fs * 0.6 && radH > fs * 1.2;

    if (fits || o.d === 1) {
      if (fits) {
        // ── Curved text-on-path ───────────────────────────────────────────
        // Left half of circle (ang > π): arc runs clockwise → text upside-down.
        // Fix: define the arc in reverse (sweep counterclockwise) for bottom half.
        const bottomHalf = famBottomHalf[fam] ?? (ang >= Math.PI / 2 && ang <= 3 * Math.PI / 2);

        // Arc endpoints at midR, spanning the full wedge angle
        // We deliberately overshoot slightly so startOffset=50% lands at mid
        // Top half: clockwise (forward order, sweep=1); bottom half: counter-clockwise (reversed, sweep=0)
        const a0 = bottomHalf ? x.x1 : x.x0;
        const a1 = bottomHalf ? x.x0 : x.x1;

        const px0 =  Math.sin(a0) * midR;
        const py0 = -Math.cos(a0) * midR;
        const px1 =  Math.sin(a1) * midR;
        const py1 = -Math.cos(a1) * midR;

        const largeArc = spanAngle > Math.PI ? 1 : 0;
        // bottomHalf: sweep-flag 0 (counterclockwise); topHalf: 1 (clockwise)
        const sweep = bottomHalf ? 0 : 1;

        const pathD = `M ${px0},${py0} A ${midR},${midR} 0 ${largeArc},${sweep} ${px1},${py1}`;

        const pathId = `lp-${o.id.replace(/[^a-zA-Z0-9]/g, '_')}`;
        svg.select('defs').empty() && svg.insert('defs', ':first-child');
        svg.select('defs').append('path')
          .attr('id', pathId)
          .attr('d', pathD);

        g.append('text')
          .attr('pointer-events', 'none')
          .append('textPath')
            .attr('href', `#${pathId}`)
            .attr('startOffset', '50%')
            .attr('text-anchor', 'middle')
            .style('font-size', `${fs}px`)
            .style('fill', tc)
            .text(lbl);

      } else {
        // ── Family ring only: wedge too small → collect for variable-length placement
        const topHalf = !(famBottomHalf[fam] ?? (ang >= Math.PI / 2 && ang <= 3 * Math.PI / 2));
        pulledLabels.push({ lbl, ang, ro2, topHalf });
      }
    }
    // else: inner ring, too small → silent (still hoverable)
  });

  // ── Variable-length radial pulled-out labels ────────────────────────────
  // All labels are horizontal, centred on the tick tip.
  // Top-half: text sits above the tip. Bottom-half: text sits below.
  // Each label gets the shortest tick that avoids 2D overlap with already-placed ones.

  const fs8 = 8;
  const charW = fs8 * 0.52;       // approximate character width
  const lineH = fs8 + 3;          // vertical clearance between label centres
  const tickGap  = 4;             // gap between wedge outer edge and tick start
  const tickBase = 14;            // minimum tick extension beyond gap
  const tickStep = 1;             // radial search increment

  function labelsOverlap(ax, ay, aHW, bx, by, bHW) {
    return Math.abs(ay - by) < lineH && Math.abs(ax - bx) < aHW + bHW + 2;
  }

  const placedTop = [], placedBot = [];

  pulledLabels.forEach(({ lbl, ang, ro2, topHalf }) => {
    const halfW = lbl.length * charW / 2;
    const bucket = topHalf ? placedTop : placedBot;
    let r = ro2 + tickGap + tickBase;

    while (r < ro2 + 150) {
      const tx = Math.sin(ang) * r;
      const ty = -Math.cos(ang) * r;
      if (!bucket.some(p => labelsOverlap(tx, ty, halfW, p.tx, p.ty, p.halfW))) {
        bucket.push({ tx, ty, halfW, ang, ro2, lbl, topHalf, r });
        break;
      }
      r += tickStep;
    }
  });

  [...placedTop, ...placedBot].forEach(({ lbl, ang, ro2, topHalf, tx, ty }) => {
    const sx = Math.sin(ang) * (ro2 + tickGap);
    const sy = -Math.cos(ang) * (ro2 + tickGap);

    g.append('line')
      .attr('x1', sx).attr('y1', sy).attr('x2', tx).attr('y2', ty)
      .attr('stroke', '#aaa').attr('stroke-width', 0.8)
      .attr('pointer-events', 'none');
    g.append('text')
      .attr('x', tx)
      .attr('y', ty + (topHalf ? -3 : 3))
      .attr('text-anchor', 'middle')
      .attr('dominant-baseline', topHalf ? 'auto' : 'hanging')
      .attr('font-size', fs8).attr('fill', '#aaa')
      .attr('pointer-events', 'none').text(lbl);
  });

    // Centre hole
  g.append('circle').attr('r', holeR - 1)
    .attr('fill', 'white').attr('stroke', '#ccc').attr('stroke-width', 0.5);
  g.append('text').attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
    .attr('font-size', 13).attr('font-weight', 600).attr('fill', '#1a1a1a').text(TOTAL);
  g.append('text').attr('y', 14).attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
    .attr('font-size', 8).attr('fill', '#888').text('langs');

  // No separate legend — families are labelled directly on the outer ring
}

const sl = document.getElementById('thresh');
const lb = document.getElementById('thresh-label');

function update() {
  const v = +sl.value;
  const minLangs = Math.ceil(v / 100 * TOTAL);
  lb.textContent = v === 0
    ? 'no filter (show all)'
    : `≥ ${v}% (≥ ${minLangs} lang${minLangs !== 1 ? 's' : ''})`;
  render(v);
}

sl.addEventListener('input', update);
window.addEventListener('resize', () => render(+sl.value));
// Small delay so clientWidth is set
setTimeout(update, 50);
</script>
</body>
</html>
