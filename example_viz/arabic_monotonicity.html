<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BLT Entropy Patcher — Visualisation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #f0f2f8;
    --surface: #ffffff;
    --border:  #d0d5e8;
    --text:    #1a1d2e;
    --muted:   #5a5f7a;
    --accent:  #2a6db5;
    --font:    'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.6;
    padding: 2rem 1rem 4rem;
  }

  .page-header {
    max-width: 98vw;
    margin: 0 auto 2.5rem;
    border-bottom: 2px solid var(--border);
    padding-bottom: 1.2rem;
  }
  .page-header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
  }
  .page-header .subtitle {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 0.25rem;
  }

  .result-card {
    max-width: 98vw;
    margin: 0 auto 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.65rem 1rem;
    background: #e8ecf7;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .label-badge {
    font-size: 0.72rem;
    font-weight: 700;
    background: rgba(42,109,181,0.12);
    color: var(--accent);
    border: 1px solid rgba(42,109,181,0.3);
    border-radius: 4px;
    padding: 2px 8px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

    .char-group {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        border: 1px solid #d0d5e8;
        border-radius: 4px;
        padding: 3px 5px;
        background: #ffffff;
        margin: 2px 1px;
        vertical-align: bottom;
    }

    .byte-row {
        display: flex;
        flex-direction: row;
        gap: 1px;
    }

    .byte-sq {
        width: 8px;
        height: 8px;
        border-radius: 1px;
    }

    .char-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1;
    }

  .stats {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .stats b { color: var(--text); font-weight: 600; }

  .text-preview {
    padding: 0.55rem 1rem;
    font-size: 0.78rem;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .text-preview.expanded {
    white-space: normal;
    overflow: visible;
    text-overflow: unset;
    }

  .patch-display {
    padding: 0.85rem 1rem;
    line-height: 2.4;
    border-bottom: 1px solid var(--border);
    word-break: break-all;
  }

  .patch-token {
    display: inline-block;
    padding: 2px 5px;
    margin: 2px 1px;
    border-radius: 3px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: default;
    transition: transform 0.1s, box-shadow 0.1s;
    white-space: pre;
  }
  .patch-token:hover {
    transform: translateY(-2px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    z-index: 1;
    position: relative;
  }

  .svg-wrap {
    overflow-x: auto;
    padding: 1rem;
  }
</style>
</head>
